name: Build MilkCount Android App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build 4 Files (APK, AAB, AssetLinks, Keystore)
        run: |
          npm install -g @bubblewrap/cli
          keytool -genkeypair -v -keystore android.keystore -alias milkcount -keyalg RSA -keysize 2048 -validity 10000 -storepass MilkCount2026 -keypass MilkCount2026 -dname "CN=MilkCount, OU=App, O=MilkCount, L=Hanamkonda, ST=TS, C=IN"
          SHA256=$(keytool -list -v -keystore android.keystore -alias milkcount -storepass MilkCount2026 | grep "SHA256:" | awk '{print $2}')
          mkdir twa && cp android.keystore twa/ && cd twa
          node -e '
            require("fs").writeFileSync("assetlinks.json", JSON.stringify([{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: "com.milkcount.vendor",
                sha256_cert_fingerprints: [process.env.SHA256]
              }
            }], null, 2));
            const site = "https:" + "//kishoreee226-netizen.github.io/milk-tracker-vendor";
            require("fs").writeFileSync("twa-manifest.json", JSON.stringify({
              packageId: "com.milkcount.vendor",
              host: "kishoreee226-netizen.github.io",
              name: "MilkCount Vendor",
              launcherName: "MilkVendor",
              display: "standalone",
              themeColor: "#0F766E",
              themeColorDark: "#0F766E",
              navigationColor: "#0F766E",
              navigationColorDark: "#0F766E",
              navigationDividerColor: "#0F766E",
              navigationDividerColorDark: "#0F766E",
              backgroundColor: "#0F766E",
              enableNotifications: true,
              startUrl: "/milk-tracker-vendor/index.html",
              iconUrl: site + "/vendor-logo.png",
              maskableIconUrl: site + "/vendor-logo.png",
              splashScreenFadeOutDuration: 300,
              signingKey: { path: "./android.keystore", alias: "milkcount" },
              appVersionName: "1.0.0",
              appVersionCode: 1,
              shortcuts: [],
              generatorApp: "bubblewrap-cli",
              webManifestUrl: site + "/manifest.json",
              fallbackType: "customtabs",
              features: {},
              alphaDependencies: { enabled: false },
              enableSiteSettingsShortcut: true,
              isChromeOSOnly: false,
              isMetaQuest: false,
              fullScopeUrl: site + "/",
              minSdkVersion: 24,
              orientation: "portrait",
              fingerprints: []
            }, null, 2));
          ' SHA256="$SHA256"
          yes | bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64 ./gradlew assembleRelease bundleRelease -Pandroid.injected.signing.store.file=$(pwd)/android.keystore -Pandroid.injected.signing.store.password=MilkCount2026 -Pandroid.injected.signing.key.alias=milkcount -Pandroid.injected.signing.key.password=MilkCount2026
          cp app/build/outputs/apk/release/app-release.apk ./app-release-signed.apk
          cp app/build/outputs/bundle/release/app-release.aab ./app-release-bundle.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MilkCount-Vendor-App
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/assetlinks.json
            twa/android.keystore
