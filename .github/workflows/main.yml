name: Build MilkCount Android App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build TWA APK and AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          npm install -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          cat << 'EOF' > ~/.bubblewrap/config.json
          {
            "jdkPath": "/usr/lib/jvm/temurin-17-jdk-amd64",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF
          keytool -genkeypair -v -keystore android.keystore -alias milkcount -keyalg RSA -keysize 2048 -validity 10000 -storepass MilkCount2026 -keypass MilkCount2026 -dname "CN=MilkCount, OU=App, O=MilkCount, L=Hanamkonda, ST=TS, C=IN"
          mkdir twa && cp android.keystore twa/ && cd twa
          node -e 'require("fs").writeFileSync("twa-manifest.json", JSON.stringify({packageId:"com.milkcount.vendor",host:"kishoreee226-netizen.github.io",name:"MilkCount Vendor",launcherName:"MilkVendor",display:"standalone",themeColor:"#0F766E",themeColorDark:"#0F766E",navigationColor:"#0F766E",navigationColorDark:"#0F766E",navigationDividerColor:"#0F766E",navigationDividerColorDark:"#0F766E",backgroundColor:"#0F766E",enableNotifications:true,startUrl:"/milk-tracker-vendor/index.html",iconUrl:"https://github.io",maskableIconUrl:"https://github.io",splashScreenFadeOutDuration:300,signingKey:{path:"./android.keystore",alias:"milkcount"},appVersionName:"1.0.0",appVersionCode:1,shortcuts:[],generatorApp:"bubblewrap-cli",webManifestUrl:"https://github.io",fallbackType:"customtabs",features:{},alphaDependencies:{enabled:false},enableSiteSettingsShortcut:true,isChromeOSOnly:false,isMetaQuest:false,fullScopeUrl:"https://github.io",minSdkVersion:21,orientation:"portrait",fingerprints:[]}))'
          yes | bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade
          printf "MilkCount2026\nMilkCount2026\n" | bubblewrap build

      - uses: actions/upload-artifact@v4
        with:
          name: MilkCount-Vendor-App
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/assetlinks.json
            twa/android.keystore
