name: Build MilkCount Android App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build TWA APK and AAB
        run: |
          npm install -g @bubblewrap/cli
          keytool -genkeypair -v -keystore android.keystore -alias milkcount -keyalg RSA -keysize 2048 -validity 10000 -storepass MilkCount2026 -keypass MilkCount2026 -dname "CN=MilkCount, OU=App, O=MilkCount, L=Hanamkonda, ST=TS, C=IN"
          mkdir twa && cp android.keystore twa/ && cd twa
          node -e 'fs.writeFileSync("twa-manifest.json", JSON.stringify({packageId:"com.milkcount.vendor",host:"kishoreee226-netizen.github.io",name:"MilkCount Vendor",launcherName:"MilkVendor",display:"standalone",themeColor:"#0F766E",backgroundColor:"#0F766E",startUrl:"/milk-tracker-vendor/index.html",iconUrl:"https://github.io",maskableIconUrl:"https://github.io",signingKey:{path:"./android.keystore",alias:"milkcount"},appVersionName:"1.0.0",appVersionCode:1,generatorApp:"bubblewrap-cli",webManifestUrl:"https://github.io",fallbackType:"customtabs",fullScopeUrl:"https://github.io",minSdkVersion:21,orientation:"portrait"}))'
          bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade
          printf "MilkCount2026\nMilkCount2026\n" | bubblewrap build
      - uses: actions/upload-artifact@v4
        with:
          name: MilkCount-Vendor-App
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/assetlinks.json
            twa/android.keystore
